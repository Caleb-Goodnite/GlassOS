# GlassOS build settings. Sourced by scripts/build-in-vm.sh.

GLASSOS_VERSION="2.2.0"
GLASSOS_CODENAME="Prism"

# GlassOS is built on Debian stable. Hyprland comes from Debian's official backports.
DEBIAN_SUITE="trixie"
DEBIAN_MIRROR="http://deb.debian.org/debian"
DEBIAN_SECURITY_MIRROR="http://deb.debian.org/debian-security"

# Account used by the live session. The installer replaces it with your own account.
LIVE_USER="glass"
LIVE_PASSWORD="glass"
LIVE_HOSTNAME="glassos"

# Sound pack that ships as the default. Packs live in ./soundpacks/<name>/.
# Drop your own pack folder in there and set its name here to bake it into the ISO.
DEFAULT_SOUNDPACK="my-sounds"

# squashfs compression: zstd boots fast; xz gives a slightly smaller ISO.
SQUASHFS_COMP="zstd"

# Software updates (Settings > Software Update). GitHub builds the glassos-desktop package on
# every merge to main and publishes it, signed, to this apt repository on GitHub Pages:
#   dev     every merge to main (test builds)
#   stable  only tagged releases (git tag v1.1.0)
UPDATE_URL="https://caleb-goodnite.github.io/GlassOS/apt"
UPDATE_CHANNEL="dev"
