# GlassOS live USB/DVD boot menu (GRUB)
set default=0
set timeout=8
set timeout_style=menu

insmod all_video
insmod gfxterm
insmod png
insmod jpeg
set gfxmode=1920x1080,1600x900,1280x800,1024x768,auto
set gfxpayload=keep
terminal_output gfxterm

set theme_dir=($root)/boot/grub/themes/glassos
loadfont $theme_dir/inter-regular-16.pf2
loadfont $theme_dir/inter-regular-20.pf2
loadfont $theme_dir/inter-regular-24.pf2
loadfont $theme_dir/inter-semibold-20.pf2
loadfont $theme_dir/inter-bold-40.pf2
loadfont $theme_dir/dejavu-sans-mono-16.pf2
set theme=$theme_dir/theme.txt
export theme

set live_args="boot=live live-media-path=/live quiet splash plymouth.splash-delay=1 plymouth.ignore-serial-consoles loglevel=3 udev.log_level=3 vt.global_cursor_default=0"
export live_args

menuentry "Try GlassOS @VERSION@" --class glassos {
  linux /live/vmlinuz $live_args
  initrd /live/initrd.img
}
menuentry "Install GlassOS @VERSION@" --class glassos {
  linux /live/vmlinuz $live_args glassos.install
  initrd /live/initrd.img
}
menuentry "Try GlassOS (safe graphics)" --class glassos {
  linux /live/vmlinuz $live_args nomodeset
  initrd /live/initrd.img
}
menuentry "Try GlassOS (run from RAM, then remove the USB)" --class glassos {
  linux /live/vmlinuz $live_args toram
  initrd /live/initrd.img
}
menuentry "Try GlassOS (show what's happening while it starts)" --class glassos {
  linux /live/vmlinuz boot=live live-media-path=/live systemd.show_status=1
  initrd /live/initrd.img
}
if [ "$grub_platform" = "efi" ]; then
  menuentry "Firmware settings (UEFI)" --class settings { fwsetup }
fi
menuentry "Restart" --class restart { reboot }
menuentry "Shut down" --class shutdown { halt }
