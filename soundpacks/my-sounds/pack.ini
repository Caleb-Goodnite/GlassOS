[pack]
name = My Sounds
author =
description = My own synth sounds.
version = 0.1
# Any event this folder has no file for plays the GlassOS default instead.
inherits = glassos-default

# Optional per-event volume (0.0 - 1.0), multiplied with the system sound volume.
[volume]
window-open = 0.5
window-close = 0.5
workspace = 0.5
