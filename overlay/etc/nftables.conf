#!/usr/sbin/nft -f
# GlassOS firewall: nothing on the internet can connect *in* to your computer unless you
# allow it. Everything you start yourself can connect out normally.
# To allow e.g. SSH:  add  "tcp dport 22 accept"  to the input chain, then
#                     sudo systemctl restart nftables
flush ruleset

table inet glassos_firewall {
  chain input {
    type filter hook input priority filter; policy drop;
    ct state established,related accept
    ct state invalid drop
    iif "lo" accept
    meta l4proto { icmp, ipv6-icmp } accept   # ping and network housekeeping
    udp dport 68 accept                      # DHCP (getting an address)
    udp dport 546 accept                     # DHCPv6
  }
  chain forward {
    type filter hook forward priority filter; policy drop;
  }
  chain output {
    type filter hook output priority filter; policy accept;
  }
}
