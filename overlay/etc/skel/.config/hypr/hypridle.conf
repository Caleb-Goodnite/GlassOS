# GlassOS idle behaviour (hypridle). Edit the timeouts (seconds) to taste.
general {
    lock_cmd = pidof hyprlock || glass-lock
    before_sleep_cmd = loginctl lock-session
    after_sleep_cmd = hyprctl dispatch 'hl.dsp.dpms({action = "on"})'
}

listener {
    timeout = 300                       # 5 min: dim the screen
    on-timeout = brightnessctl -s set 30%
    on-resume = brightnessctl -r
}

listener {
    timeout = 600                       # 10 min: lock
    on-timeout = loginctl lock-session
}

listener {
    timeout = 660                       # 11 min: screen off
    on-timeout = hyprctl dispatch 'hl.dsp.dpms({action = "off"})'
    on-resume = hyprctl dispatch 'hl.dsp.dpms({action = "on"})'
}

listener {
    timeout = 900                       # 15 min: sleep, if running on battery
    on-timeout = /usr/lib/glassos/sleep-on-battery
}
