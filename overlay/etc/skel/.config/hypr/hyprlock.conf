# GlassOS lock screen (hyprlock)
general {
    hide_cursor = true
    ignore_empty_input = true
}

animations {
    enabled = true
    bezier = glass, 0.16, 1, 0.3, 1
    animation = fadeIn, 1, 5, glass
    animation = fadeOut, 1, 4, glass
    animation = inputFieldDots, 1, 2, glass
}

# Your wallpaper, blurred (glass-lock points this file at it). Not "screenshot": that kept
# Hyprland redrawing the whole screen nonstop while locked, using whole processor cores.
background {
    monitor =
    path = ~/.cache/glassos/lock-background
    blur_passes = 4
    blur_size = 9
    brightness = 0.7
    vibrancy = 0.25
    noise = 0.012
}

label {
    monitor =
    text = cmd[update:30000] date +"%A, %B %-d"
    color = rgba(255, 255, 255, 0.85)
    font_size = 20
    font_family = Inter SemiBold
    position = 0, 230
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:1000] date +"%-I:%M"
    color = rgba(255, 255, 255, 0.95)
    font_size = 108
    font_family = Inter Bold
    # no text shadows: the clock redraws every second, and redrawing shadows each time costs
    # far more than the text itself
    position = 0, 120
    halign = center
    valign = center
}

input-field {
    monitor =
    size = 300, 50
    outline_thickness = 1
    rounding = -1
    outer_color = rgba(255, 255, 255, 0.35)
    inner_color = rgba(255, 255, 255, 0.12)
    font_color = rgb(255, 255, 255)
    check_color = rgba(143, 199, 255, 0.7)
    fail_color = rgba(255, 120, 130, 0.8)
    fade_on_empty = false
    placeholder_text = <span foreground="##ffffffaa">Password for $USER</span>
    fail_text = <span foreground="##ffffffdd">$FAIL</span>
    dots_size = 0.22
    dots_spacing = 0.35
    font_family = Inter
    position = 0, -90
    halign = center
    valign = center
}
