# GlassOS app search (Super+Space)
[main]
font=Inter:size=13,FontAwesome:size=12
prompt="  "
placeholder=Search apps
icon-theme=Papirus-Dark
icons-enabled=yes
terminal=foot -e
launch-prefix=glass-launch
lines=8
width=40
horizontal-pad=22
vertical-pad=18
inner-pad=12
line-height=30
layer=overlay
exit-on-keyboard-focus-loss=yes
match-mode=fzf

[colors]
background=1c1d2ab8
text=e8e9f2ff
prompt=ffffffb0
placeholder=ffffff70
input=ffffffff
match=8fc7ffff
selection=ffffff2e
selection-text=ffffffff
selection-match=b2dbffff
counter=ffffff60
border=ffffff4d

[border]
width=1
radius=24
