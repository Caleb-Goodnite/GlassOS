# GlassOS network privacy defaults
[connectivity]
# No "phone home" connectivity checks to any company's server
enabled=false

[device]
# Random MAC address while scanning for Wi-Fi, so you can't be tracked between places
wifi.scan-rand-mac-address=yes

[connection]
# A different (but stable) hardware address per Wi-Fi network
wifi.cloned-mac-address=stable
# IPv6 privacy addresses
ipv6.ip6-privacy=2
