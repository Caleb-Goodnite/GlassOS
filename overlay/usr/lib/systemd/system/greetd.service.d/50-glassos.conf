# GlassOS: the login screen (or automatic login) takes over tty1 straight from the boot splash,
# so the text "glassos login:" prompt never flashes up in between. Text logins stay on
# Ctrl+Alt+F2 to F6 in case the graphics ever fail.
[Unit]
Conflicts=getty@tty1.service
After=getty@tty1.service plymouth-quit-wait.service
